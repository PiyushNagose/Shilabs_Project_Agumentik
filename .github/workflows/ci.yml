name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shilabs
          POSTGRES_PASSWORD: shilabs
          POSTGRES_DB: shilabs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shilabs -d shilabs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shilabs:shilabs@localhost:5432/shilabs_test
      TEST_DATABASE_URL: postgresql://shilabs:shilabs@localhost:5432/shilabs_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters
      AI_PROVIDER: openai
      OPENAI_API_KEY: ci-test-key
      OPENAI_MODEL: ci-test-model
      OPENAI_EMBEDDING_MODEL: ci-test-embedding-model
      BCRYPT_SALT_ROUNDS: 10
      REALTIME_INTERNAL_SECRET: ci-test-realtime-secret
      EXOTEL_WEBHOOK_SECRET: ci-test-exotel-webhook-secret
      VOICE_AI_STREAM_TOKEN: ci-test-voice-stream-signing-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run db:seed -w @shilabs/api
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
