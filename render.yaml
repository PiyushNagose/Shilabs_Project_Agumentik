services:
  - type: web
    name: shilabs-sales-api
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run db:generate -w @shilabs/api && npm run build -w @shilabs/api -w @shilabs/worker
    startCommand: npm run db:deploy -w @shilabs/api && npm run db:seed -w @shilabs/api && node scripts/start-production.cjs
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: shilabs-sales-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: shilabs-sales-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REALTIME_INTERNAL_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: DEV_ADMIN_EMAIL
        sync: false
      - key: DEV_ADMIN_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: CALENDAR_PROVIDER
        value: none
      - key: VOICE_PROVIDER
        value: none
      - key: MESSAGING_PROVIDER
        value: none
      - key: EMAIL_PROVIDER
        value: AWS_SES
      - key: AI_AUTOSTART_ON_LEAD_CREATE
        value: "false"

  - type: keyvalue
    name: shilabs-sales-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: shilabs-sales-db
    plan: free
    region: singapore
    databaseName: shilabs_sales
    user: shilabs
