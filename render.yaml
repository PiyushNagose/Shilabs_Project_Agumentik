services:
  - type: web
    name: shilabs-sales-api
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run db:generate -w @shilabs/api && npm run build -w @shilabs/api -w @shilabs/worker
    startCommand: npm run db:deploy -w @shilabs/api && node scripts/seed-production.cjs && node scripts/start-production.cjs
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: shilabs-sales-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: shilabs-sales-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REALTIME_INTERNAL_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: WORKER_API_BASE_URL
        sync: false
      - key: PRODUCTION_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: PRODUCTION_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_MAX_RETRIES
        value: "1"
      - key: CALENDAR_PROVIDER
        value: google
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        sync: false
      - key: CALENDAR_OAUTH_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CALENDAR_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_CALENDAR_SCOPE
        value: https://www.googleapis.com/auth/calendar.freebusy https://www.googleapis.com/auth/calendar.events
      - key: CALENDAR_DEFAULT_TIME_ZONE
        value: Asia/Kolkata
      - key: CALENDAR_TIMEOUT_MS
        value: "30000"
      - key: CALENDAR_MAX_RETRIES
        value: "1"
      - key: ZOHO_BIGIN_ACCOUNTS_URL
        sync: false
      - key: ZOHO_BIGIN_API_DOMAIN
        sync: false
      - key: ZOHO_BIGIN_CLIENT_ID
        sync: false
      - key: ZOHO_BIGIN_CLIENT_SECRET
        sync: false
      - key: ZOHO_BIGIN_REFRESH_TOKEN
        sync: false
      - key: ZOHO_BIGIN_REQUIRED_SCOPES
        value: ZohoBigin.modules.ALL
      - key: ZOHO_BIGIN_TIMEOUT_MS
        value: "30000"
      - key: ZOHO_BIGIN_MAX_RETRIES
        value: "1"
      - key: VOICE_PROVIDER
        value: none
      - key: MESSAGING_PROVIDER
        value: none
      - key: MESSAGING_WEBHOOK_BASE_URL
        sync: false
      - key: MESSAGING_TIMEOUT_MS
        value: "30000"
      - key: MESSAGING_MAX_RETRIES
        value: "1"
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_DEFAULT_TEMPLATE_NAME
        sync: false
      - key: TWILIO_WHATSAPP_ACCOUNT_SID
        sync: false
      - key: TWILIO_WHATSAPP_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_SANDBOX_FROM
        sync: false
      - key: VOICE_WEBHOOK_BASE_URL
        sync: false
      - key: VOICE_PRODUCTION_CALLING_ENABLED
        value: "false"
      - key: VOICE_COMPLIANCE_CONSENT_MODE
        value: disabled
      - key: VOICE_TIMEOUT_MS
        value: "30000"
      - key: VOICE_MAX_RETRIES
        value: "1"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: EXOTEL_ACCOUNT_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_CALLER_ID
        sync: false
      - key: EXOTEL_APP_URL
        sync: false
      - key: EXOTEL_AGENT_NUMBER
        sync: false
      - key: EXOTEL_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: AWS_SES
      - key: AWS_SES_REGION
        sync: false
      - key: AWS_SES_FROM_EMAIL
        sync: false
      - key: AWS_SES_REPLY_TO_EMAIL
        sync: false
      - key: AWS_SES_WEBHOOK_SECRET
        sync: false
      - key: AWS_SES_CONFIGURATION_SET
        sync: false
      - key: AWS_SES_INBOUND_TOPIC_ARN
        sync: false
      - key: AWS_SES_INBOUND_BUCKET
        sync: false
      - key: AWS_SES_INBOUND_KEY_PREFIX
        value: inbound/
      - key: AWS_SES_TIMEOUT_MS
        value: "30000"
      - key: AWS_SES_MAX_RETRIES
        value: "1"
      - key: AWS_SES_USE_DEFAULT_CREDENTIAL_CHAIN
        value: "false"
      - key: AWS_SES_ACCESS_KEY_ID
        sync: false
      - key: AWS_SES_SECRET_ACCESS_KEY
        sync: false
      - key: AI_AUTOSTART_ON_LEAD_CREATE
        value: "false"
      - key: OPS_ALERT_WEBHOOK_URL
        sync: false
      - key: OPS_ALERT_WEBHOOK_SECRET
        sync: false

  - type: keyvalue
    name: shilabs-sales-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: shilabs-sales-db
    plan: free
    region: singapore
    databaseName: shilabs_sales
    user: shilabs
